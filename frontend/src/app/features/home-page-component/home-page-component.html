<section class="cars-section">
  <table class="cars-table">
    <thead>
    <tr>
      <th>ID</th>
      <th>Marca</th>
      <th>Modelo</th>
      <th>Unidades</th>
    </tr>
    </thead>
    <tbody>
      @for (car of carsService.cars(); track car.id) {
        <tr>
          <td>{{ car.id }}</td>
          <td>{{ car.brandName }}</td>
          <td>{{ car.modelName }}</td>
          <td>{{ car.total }}</td>
        </tr>
      }
      @empty {
        <tr>
          <td colspan="3">No cars available</td>
        </tr>
      }
    </tbody>
  </table>
</section>
